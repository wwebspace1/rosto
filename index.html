<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>روستو | شاورما سوري</title>
<link href="https://fonts.googleapis.com/css2?family=Rakkas&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--red:#8C1B2F;--red-d:#5E0F1E;--gold:#E8AE3E;--paper:#FFF8EC;--ink:#2B1511;--line:#D9C7A8;--card:#FFFFFF}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#1E1210;--ink:#F6E9D2;--line:#4A332C;--card:#2A1A17}}
:root[data-theme="dark"]{--paper:#1E1210;--ink:#F6E9D2;--line:#4A332C;--card:#2A1A17}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font:400 17px/1.7 Tajawal,Tahoma,sans-serif}
.hero{background:var(--red);color:#FFF4DC;padding:56px 22px 64px;text-align:center;position:relative;overflow:hidden}
.hero h1{font:400 clamp(110px,28vw,260px)/.9 Rakkas,Tahoma,serif;margin:0;color:var(--gold);letter-spacing:-.02em;animation:rise .9s ease-out both}
.hero p{margin:10px auto 26px;max-width:30ch;font-size:1.2rem}
.btn{display:inline-block;background:var(--gold);color:var(--red-d);font-weight:700;padding:12px 28px;border-radius:999px;text-decoration:none}
.btn:focus-visible,.tab:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
@keyframes rise{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.hero h1{animation:none}}
main{max-width:760px;margin:0 auto;padding:44px 20px}
h2{font:400 2.2rem/1.2 Rakkas,Tahoma,serif;color:var(--red);margin:0 0 6px}
@media (prefers-color-scheme:dark){h2{color:var(--gold)}}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:14px 0 22px}
.tab{flex:none;border:1.5px solid var(--red);background:transparent;color:var(--ink);font:500 1rem Tajawal,sans-serif;padding:7px 18px;border-radius:999px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--red);color:#FFF4DC}
.item{display:flex;align-items:baseline;gap:10px;padding:10px 0}
.item .n{font-weight:700}
.item .d{flex:1;border-bottom:2px dotted var(--line);transform:translateY(-4px)}
.item .p{font-weight:700;color:var(--red);white-space:nowrap}
@media (prefers-color-scheme:dark){.item .p{color:var(--gold)}}
.sub{font-size:.9rem;opacity:.75;margin:-6px 0 4px}
.note{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;font-size:.92rem;margin-top:28px}
footer{background:var(--red-d);color:#F3DDB4;text-align:center;padding:30px 20px;font-size:.95rem}
footer b{color:var(--gold);font-size:1.15rem}

.gal{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:28px 0 8px}
.gal img{width:100%;height:auto;border-radius:12px;display:block}
.gal .w{grid-column:span 2}
.hot{display:inline-block;margin-top:10px;color:var(--gold);font-weight:700;font-size:1.15rem;direction:ltr;text-decoration:none}
</style>
</head>
<body>
<header class="hero">
  <h1>روستو</h1>
  <p>شاورما سوري على الصاج، ومشاوي ومقبلات على أصولها</p>
  <a class="btn" href="#menu">شوف المنيو</a>
</header>
